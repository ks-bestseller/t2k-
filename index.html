))))}function render(){let a=filtered();$('#count').textContent=a.length;let cats={};a.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+1);let topcat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0]||['-',0];$('#topcat').textContent=topcat[0];let p={};a.forEach(x=>p[x.price]=(p[x.price]||0)+1);let topp=Object.entries(p).sort((a,b)=>b[1]-a[1])[0]||['-',0];$('#topprice').textContent=topp[0];$('#covered').textContent=a.length?Math.round(a.filter(x=>x.cover==='是').length/a.length*100)+'%':'-';$('#grid').innerHTML=a.map(x=>`<a class="card" href="${x.link}" target="_blank" style="text-decoration:none;color:inherit"><div class="pic"><img src="${x.img}" loading="lazy"></div><div class="body"><span class="rank">#${x.rank}</span><div class="name">${x.name}</div><div class="meta"><span>${x.cat}</span><span>品服覆盖：${x.cover}</span></div><div class="price">${x.price}元</div></div></a>`).join('');let mx=Math.max(1,...Object.values(cats));$('#bars').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<div class="barrow"><span class="barlabel">${k}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><span class="barval">${v}</span></div>`).join('')}['q','cat','price','cover'].forEach(k=>$('#'+k).addEventListener(k==='q'?'input':'change',e=>{state[k]=e.target.value;render()}));document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{state.top=btn.dataset.top;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===btn));render()}));render();</script></body></html>
